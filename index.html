<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de la Compra</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 Lista de la Compra</h1>
      <nav class="tabs">
        <button class="tab active" data-tab="search">Buscar precios</button>
        <button class="tab" data-tab="list">Mi lista <span class="badge-count" id="listCount"></span></button>
        <button class="tab" data-tab="settings">Mis supermercados</button>
      </nav>
    </header>

    <!-- ===== TAB: BUSCAR PRECIOS ===== -->
    <section class="tab-content active" id="tab-search">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar producto..." autocomplete="off" />
        <button id="clearSearch" class="btn-icon" title="Limpiar" style="display:none">✕</button>
      </div>

      <div id="searchResults"></div>
    </section>

    <!-- ===== TAB: MI LISTA ===== -->
    <section class="tab-content" id="tab-list">
      <div class="add-form-simple">
        <input type="text" id="manualInput" placeholder="Añadir artículo manualmente..." maxlength="60" />
        <button id="manualAdd">Añadir</button>
      </div>
      <ul class="item-list" id="itemList"></ul>
      <div class="list-actions" id="listActions" style="display:none">
        <button class="btn-secondary" id="clearDone">Eliminar comprados</button>
        <button class="btn-danger" id="clearAll">Vaciar lista</button>
      </div>
    </section>

    <!-- ===== TAB: MIS SUPERMERCADOS ===== -->
    <section class="tab-content" id="tab-settings">
      <p class="settings-hint">Activa los supermercados de tu zona para ver sus precios en las búsquedas.</p>
      <ul class="supermarket-list" id="supermarketList"></ul>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
